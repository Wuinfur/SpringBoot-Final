# Nombre de la aplicación (esto ya lo tenías)
spring.application.name=productos-api

# --- Configuración de la Base de Datos H2 ---

# URL de conexión a H2 en memoria 
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola web de H2 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Configuración de JPA (Hibernate) ---

# DDL-Auto: para que cree las tablas automáticamente al iniciar 
# (usamos 'create-drop' para que las cree al iniciar y las borre al parar, ideal para desarrollo)
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar en consola las consultas SQL que ejecuta JPA 
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Formatear el SQL mostrado en consola para que sea legible 
spring.jpa.properties.hibernate.format_sql=true